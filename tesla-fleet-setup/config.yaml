name: "Tesla Fleet Setup"
description: "Guided setup wizard and signing proxy for Tesla Fleet API integration with Home Assistant"
version: "0.8.3"
slug: tesla-fleet-setup
url: "https://github.com/ds2000/ha-tesla-fleet-setup"
arch:
  - aarch64
  - amd64
  - armv7
init: false
homeassistant_api: true
host_network: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:car-electric"
panel_title: "Tesla Setup"
ports:
  8099/tcp: null
  443/tcp: 443
  4443/tcp: 4443
map:
  - config:rw
  - ssl:rw
  - share:rw
options:
  log_level: info
  proxy_autostart: true
schema:
  log_level: list(debug|info|warning|error)
  proxy_autostart: bool
